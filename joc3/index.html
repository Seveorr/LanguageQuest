<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Practica converses</title>
    <link rel="stylesheet" href="../gameStyle.css">
</head>

<body>

    <div class="game-wrapper">
        <div id="phaseHeader" class="phase-header">
            <span id="gameTitle">💬 Practica converses</span>
            <div class="right-group">
                <span id="headerTitle">Tria què diries per avançar el diàleg</span>
                <span id="sectionBadge" class="section-badge">Diàleg 1 / 5</span>
            </div>
        </div>

        <div class="main-container">

            <div class="sidebar">
                <h3>Progrés</h3>
                <div id="progressContainer" class="progress-container"></div>
            </div>

            <div class="card">
                <h2 id="sceneTitle"></h2>

                <div id="gameArea" class="game-area">
                    <div class="conversation-layout">

                        <div class="conversation-side">
                            <div class="character">
                                <div class="avatar" id="avatar"></div>
                                <span class="character-name" id="characterName"></span>
                            </div>
                        </div>

                        <div class="conversation-main">

                            <div id="tipBox" class="duo-sentence-hint" style="display:none;"></div>

                            <div class="dialogue-box target-zone" id="dialogueBox">
                                <p class="dialogue-text" id="npcText"></p>
                            </div>

                            <button class="speak-btn" id="speakBtn">🔊 Repetir àudio</button>

                            <div id="optionsArea" style="width:100%;">
                                <p class="prompt">TU DIUS:</p>
                                <div class="options" id="options"></div>
                            </div>

                            <div id="msg"></div>

                        </div>
                    </div>
                </div>

                <div class="exit-container">
                    <button class="btn-exit" onclick="showExitModal()">Acabar partida</button>
                </div>
            </div>

        </div>
    </div>

    <div id="exitModal" class="modal-overlay">
        <div class="modal-box">
            <h1>Alerta!</h1>
            <h2>Estàs segur que vols acabar la partida actual i tornar al menú?</h2>
            <div class="modal-buttons">
                <button class="btn-modal confirm" onclick="redirectToMenu()">Sí, vull sortir</button>
                <button class="btn-modal cancel" onclick="hideExitModal()">Cancel·lar</button>
            </div>
        </div>
    </div>

    <script src="dades.js"></script>

    <script src="script.js"></script>
</body>

</html>
