<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Talker</title>
    <link rel="stylesheet" href="../gameStyle.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2245%22 y=%2280%22 font-size=%2280%22 text-anchor=%22middle%22>🎤</text></svg>">
</head>

<body>

    <div class="game-wrapper">
        <div id="phaseHeader" class="phase-header">
            <span id="gameTitle">🎤 Talker</span>
            <div class="right-group">
                <span id="headerTitle">Pronuncia les paraules</span>
                <span id="sectionBadge" class="section-badge">Secció 1 / 3</span>
            </div>
        </div>

        <div class="main-container">

            <div class="sidebar">
                <h3>Progrés</h3>
                <div id="progressContainer" class="progress-container"></div>
            </div>

            <div class="card">
                <div id="topInfo">
                    <h2 id="question"></h2>
                </div>

                <div id="gameArea" class="game-area"></div>

                <div id="msg"></div>

                <div id="finalScreen" class="final-screen"></div>

                <div id="exitContainer" class="exit-container">
                    <button class="btn-exit" onclick="showExitModal()">Acabar partida</button>
                </div>
            </div>

        </div>
    </div>

    <div id="exitModal" class="modal-overlay">
        <div class="modal-box">
            <h1>Alerta!</h1>
            <h2>Estàs segur que vols acabar la partida actual i tornar al menú?</h2>
            <div class="modal-buttons">
                <button class="btn-modal confirm" onclick="redirectToMenu()">Sí, vull sortir</button>
                <button class="btn-modal cancel" onclick="hideExitModal()">Cancel·lar</button>
            </div>
        </div>
    </div>

    <script src="dades.js"></script>

    <script src="script.js"></script>
</body>

</html>
